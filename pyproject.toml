[project]
name = "orbit-api"
version = "0.1.0"
description = "Orbit Fitness & Diet Tracking — FastAPI backend"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi (==0.139.0)",
    "uvicorn (==0.50.0)",
    "pydantic (==2.13.4)",
    "pydantic-settings (==2.14.2)",
    "structlog (==26.1.0)",
    "sentry-sdk (==2.64.0)",
    "boto3 (==1.43.40)",
    "sqlalchemy (==2.0.51)",
    "asyncpg (==0.31.0)",
    "alembic (==1.18.5)",
    "greenlet (==3.5.3)",
    "firebase-admin (==7.5.0)",
    "redis (==8.0.1)",
]

[tool.poetry]
packages = [{ include = "orbit", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "7.1.0"
pytest-asyncio = "1.4.0"
httpx = "0.28.1"
testcontainers = { version = "4.14.2", extras = ["postgres"] }
requests = "2.34.2"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "perf: performance-budget tests owned by the k6/load run, excluded from the CI test job",
]

[build-system]
requires = ["poetry-core>=1.9.0,<2.0.0"]
build-backend = "poetry.core.masonry.api"


